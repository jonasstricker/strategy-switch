<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StrSwitch">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Strategy Switch</title>
</head>
<body>

  <div id="authScreen" style="display:none;position:fixed;inset:0;background:#0d1117;z-index:9999;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;padding:32px;">
      <h2 style="color:#e6edf3;margin-bottom:16px;">🔒 Strategy Switch</h2>
      <input id="authPw" type="password" placeholder="Passwort" style="padding:12px 16px;font-size:16px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;width:200px;text-align:center;">
      <br><button id="authBtn" style="margin-top:12px;padding:10px 32px;font-size:14px;border-radius:8px;background:#238636;color:#fff;border:none;cursor:pointer;">Anmelden</button>
      <div id="authErr" style="color:#f85149;margin-top:8px;font-size:13px;display:none;">Falsches Passwort</div>
    </div>
  </div>

  <div class="header" id="mainApp" style="display:none;">
    <h1>📊 Strategy Switch</h1>
    <div class="subtitle" id="lastUpdate">Laden …</div>
    <div class="auto-info">Core: Signal (Schlusskurs Vortag) + Trading Mo–Fr ab 14:45 UTC | Info-Tabs: Mo–Fr 21:00 UTC</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content" id="content">
    <div class="loading" id="loader">
      <div class="spinner"></div>
      <div>Signale werden geladen …</div>
    </div>
  </div>

  <script>
    // ── Auth ────────────────────────────────────────────────────────────
    const AUTH_HASH = 'c57a5df4f97ed6914116e5fd1348406064834f22503d890eb571af442ac4b4c3'; // sha256 of password
    async function sha256(msg) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
    }
    function checkAuth() {
      if (sessionStorage.getItem('auth') === '1') { showApp(); return; }
      document.getElementById('authScreen').style.display = 'flex';
    }
    function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = '';
      document.getElementById('tabs').style.display = '';
      document.getElementById('content').style.display = '';
      fetchSignals();
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tabs').style.display = 'none';
      document.getElementById('content').style.display = 'none';
      checkAuth();
      document.getElementById('authBtn').addEventListener('click', tryAuth);
      document.getElementById('authPw').addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });
    });
    async function tryAuth() {
      const pw = document.getElementById('authPw').value;
      const hash = await sha256(pw);
      if (hash === AUTH_HASH) {
        sessionStorage.setItem('auth', '1');
        showApp();
      } else {
        document.getElementById('authErr').style.display = 'block';
        document.getElementById('authPw').value = '';
      }
    }

    // ── State ───────────────────────────────────────────────────────────
    let D = {};          // full data
    let allSignals = []; // etfs
    let tradeLog = [];   // alpaca paper log of the old Alpha-Mix (entries without core_signal)
    let coreLogs = {paper: [], live: []};  // Alpaca runs of the Core strategy
    let QUOTA = [];      // equity quota log of SSO/QLD (tax evidence)
    let CORE = null;     // core strategy signal (traded)
    let activeTab = 'core';
    let subTab = {};     // per-tab sub-tab

    // ── Fetch ───────────────────────────────────────────────────────────
    async function optJson(r) {
      try { return r && r.ok ? await r.json() : null; } catch (e) { return null; }
    }
    function parseCsv(txt) {
      const [head, ...rows] = txt.trim().split(/\r?\n/).map(l => l.split(','));
      return rows.filter(r => r.length === head.length)
        .map(r => Object.fromEntries(head.map((k, i) => [k, r[i]])));
    }
    async function fetchSignals() {
      try {
        const t = '?t=' + Date.now();
        const [resp, tlResp, coreResp, liveResp, quotaResp] = await Promise.all([
          fetch('data/mobile_signals.json' + t).catch(() => null),
          fetch('data/trade_log.json' + t).catch(() => null),
          fetch('data/core_signal.json' + t).catch(() => null),
          fetch('data/trade_log_live.json' + t).catch(() => null),
          fetch('data/equity_quota.csv' + t).catch(() => null)
        ]);
        if (coreResp && coreResp.ok) CORE = await coreResp.json();
        if (!CORE) activeTab = 'overview';
        if (!(resp && resp.ok) && !CORE) throw new Error('Noch keine Daten');
        if (resp && resp.ok) D = await resp.json();
        allSignals = D.etfs || [];
        const paper = await optJson(tlResp), live = await optJson(liveResp);
        if (Array.isArray(paper)) {
          tradeLog = paper.filter(e => !e.core_signal);
          coreLogs.paper = paper.filter(e => e.core_signal);
        }
        if (Array.isArray(live)) coreLogs.live = live.filter(e => e.core_signal);
        try { if (quotaResp && quotaResp.ok) QUOTA = parseCsv(await quotaResp.text()); } catch (e) { QUOTA = []; }
        document.getElementById('lastUpdate').textContent = 'Stand: ' + (CORE ? CORE.generated_utc : (D.updated || '?'));
        if (CORE || allSignals.length || D.swarm || D.value || D.turnaround) { buildTabs(); render(); }
        else {
          document.getElementById('content').innerHTML =
            '<div class="loading"><div>⏳ Erste Berechnung steht aus</div><div style="margin-top:12px;font-size:13px;color:#8b949e;">Daten werden automatisch Mo–Fr berechnet (Core 14:45 UTC, Info-Tabs 21:00 UTC).</div></div>';
        }
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<div class="loading"><div>⏳ Noch keine Daten</div><div style="margin-top:12px;font-size:13px;color:#8b949e;">Die Berechnung läuft automatisch Mo–Fr (Core 14:45 UTC, Info-Tabs 21:00 UTC).<br>Bitte später erneut öffnen.</div></div>';
      }
    }

    // ── Dynamic Tabs ────────────────────────────────────────────────────
    function buildTabs() {
      const tabBar = document.getElementById('tabs');
      let tabs = [];
      if (CORE) tabs.push({key:'core', label:'🎯 Core'});
      tabs.push({key:'overview', label:'Übersicht'});
      if (D.alpha_mix) tabs.push({key:'alpha_mix', label:'🧬 Alpha-Mix'});
      if (D.alpha_boost) tabs.push({key:'alpha_boost', label:'🚀 Boost 2x'});
      if (D.swarm) tabs.push({key:'swarm', label:'🐝 Schwarm'});
      if (D.value) tabs.push({key:'value', label:'💎 Value'});
      if (D.turnaround) tabs.push({key:'turnaround', label:'🔄 Turnar.'});
      // ETFs last
      for (const e of allSignals) {
        if (e.ticker === 'URTH') tabs.push({key: e.ticker, label: 'URTH'});
      }
      tabs.push({key:'compare', label:'📊 Vergleich'});
      tabs.push({key:'methodik', label:'📖 Info'});
      tabBar.innerHTML = tabs.map(t =>
        `<div class="tab ${activeTab===t.key?'active':''}" data-tab="${t.key}">${t.label}</div>`
      ).join('');
    }

    document.getElementById('tabs').addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.tab;
      render();
    });

    // ── Main Render ─────────────────────────────────────────────────────
    function render() {
      if (!allSignals.length && !D.swarm && !CORE) return;
      const c = document.getElementById('content');
      if (activeTab === 'core') { c.innerHTML = renderCore(); afterCoreRender(); }
      else if (activeTab === 'overview') c.innerHTML = renderOverview();
      else if (activeTab === 'swarm') { c.innerHTML = renderCategory(D.swarm, '🐝 Aktien-Schwarm (Top-10 Market Cap)'); afterCategoryRender(D.swarm); }
      else if (activeTab === 'value') { c.innerHTML = renderCategory(D.value, '💎 Value-Aktien (Top-10 Bewertung)'); afterCategoryRender(D.value); }
      else if (activeTab === 'turnaround') { c.innerHTML = renderCategory(D.turnaround, '🔄 Turnaround-Aktien'); afterCategoryRender(D.turnaround); }
      else if (activeTab === 'alpha_mix') { c.innerHTML = renderAlphaMix(D.alpha_mix); afterCategoryRender(D.alpha_mix); }
      else if (activeTab === 'alpha_boost') { c.innerHTML = renderAlphaBoost(D.alpha_boost); afterCategoryRender(D.alpha_boost); }
      else if (activeTab === 'compare') c.innerHTML = renderComparison();
      else if (activeTab === 'methodik') c.innerHTML = renderMethodik();
      else {
        const data = allSignals.find(s => s.ticker === activeTab);
        if (data) { c.innerHTML = renderETF(data); afterETFRender(data); }
      }
      if (!['core', 'compare', 'methodik'].includes(activeTab))
        c.insertAdjacentHTML('afterbegin', '<div class="info-note">ℹ️ <strong>Nur Information – wird nicht gehandelt.</strong> Gehandelt wird ausschließlich die Core-Strategie (Tab 🎯 Core). Warum die alten Strategien nicht mehr laufen: Tab 📖 Info.</div>');
      wireClicks(c);
    }

    function wireClicks(c) {
      c.querySelectorAll('.etf-mini-card').forEach(card => {
        card.addEventListener('click', () => {
          activeTab = card.dataset.ticker;
          document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
          render();
        });
      });
      c.querySelectorAll('.sub-tab').forEach(st => {
        st.addEventListener('click', () => { subTab[activeTab] = st.dataset.sub; render(); });
      });
      // Stock detail click
      c.querySelectorAll('.stock-card[data-stock]').forEach(card => {
        card.addEventListener('click', () => {
          const ticker = card.dataset.stock;
          const catKey = activeTab;
          const cat = D[catKey];
          if (cat) showStockDetail(ticker, cat);
        });
      });
    }

    // ══════════════════════════════════════════════════════════════════════
    // ── OVERVIEW ────────────────────────────────────────────────────────
    // ══════════════════════════════════════════════════════════════════════
    function renderOverview() {
      let h = '';
      if (CORE) {
        const sl = CORE.sleeves || [], on = sl.filter(x => x.signal === 'RISK_ON').length;
        const S = CORE.backtest ? CORE.backtest.strategy : null;
        h += `<div class="section"><div class="section-title">🎯 Gehandelt</div><div class="etf-overview">
          <div class="etf-mini-card" data-ticker="core">
            <div class="etf-ticker">Core ${Number((CORE.config || {}).leverage || 2)}x</div>
            <div class="etf-name">S&amp;P 500 + Nasdaq-100, Trendfilter SMA200</div>
            <div class="etf-signal ${on === sl.length ? 'long' : on ? '' : 'cash'}">${on === sl.length ? '🟢 RISK ON' : on ? '🟡 TEILWEISE' : '🔴 RISK OFF'}</div>
            <div style="font-size:11px;color:#8b949e;margin-top:4px;">${S ? 'Backtest ' + pct(S.cagr) + '% p.a. · MaxDD ' + pct(S.max_dd) + '%' : ''}</div>
          </div></div></div>`;
      }
      h += '<div class="section"><div class="section-title">ETF Signal</div><div class="etf-overview">';
      for (const s of allSignals) {
        if (s.ticker !== 'URTH') continue;
        const isL = s.signal==='LONG';
        h += `<div class="etf-mini-card" data-ticker="${s.ticker}">
          <div class="etf-ticker">${s.ticker.replace('.DE','')}</div>
          <div class="etf-name">${s.name}</div>
          <div class="etf-signal ${isL?'long':'cash'}">${isL?'🟢 LONG':'🔴 CASH'}</div>
          ${marginBadge(s.signal_margin, s.signal)}
          <div style="font-size:11px;color:#8b949e;margin-top:4px;">${s.strategy}</div>
        </div>`;
      }
      h += '</div></div>';

      // Category cards — Alpha first, then rest
      for (const [key, label, icon] of [['alpha_mix','Alpha-Mix','🧬'],['alpha_boost','Boost 2x','🚀'],['swarm','Schwarm','🐝'],['value','Value','💎'],['turnaround','Turnaround','🔄']]) {
        const cat = D[key];
        if (!cat) continue;
        // Compute Alpaca return for alpha_mix
        let alpacaInfo = '';
        if (key === 'alpha_mix' && tradeLog.length >= 2) {
          const startEq = tradeLog[0].equity;
          const lastEq = tradeLog[tradeLog.length-1].equity;
          const alpRet = ((lastEq / startEq - 1) * 100).toFixed(1);
          const days = tradeLog.length;
          alpacaInfo = `<div style="margin-top:6px;padding:6px 8px;background:#161b22;border-radius:6px;border:1px solid #30363d;font-size:12px;">
            <div style="display:flex;justify-content:space-between;">
              <span>📈 Backtest CAGR:</span><span style="color:var(--green);font-weight:700;">${pct(cat.cagr_switch)}%</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:2px;">
              <span>🏦 Alpaca (${days} Tage):</span><span style="color:#d29922;font-weight:700;">${alpRet>0?'+':''}${alpRet}%</span>
            </div>
          </div>`;
        }
        h += `<div class="section"><div class="section-title">${icon} ${label}</div>
          <div class="etf-mini-card" data-ticker="${key}" style="margin-bottom:10px;">
            <div class="etf-ticker">${icon} ${label}${key==='alpha_mix'||key==='alpha_boost'?'':' Top-10'}</div>
            <div class="etf-name">${cat.n_long}/${cat.n_total} Aktien LONG</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">`;
        for (const st of cat.stocks) {
          const isL = st.signal==='LONG';
          h += `<span class="stock-chip-small ${isL?'long':'cash'}">${st.ticker} ${isL?'🟢':'🔴'}</span>`;
        }
        h += `</div>${alpacaInfo}</div></div>`;
      }

      // 12M returns
      h += '<div class="section"><div class="section-title">12 Monate Return</div>';
      for (const s of allSignals) {
        if (s.ticker !== 'URTH') continue;
        const sw=pct(s.return_1y_switch), bh=pct(s.return_1y_bh);
        const cls = s.return_1y_switch>=s.return_1y_bh ? 'positive':'negative';
        h += `<div class="metric-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-weight:700;">${s.ticker.replace('.DE','')}</div><div style="font-size:11px;color:#8b949e;">${s.name}</div></div>
          <div style="text-align:right;"><div class="metric-value ${cls}" style="font-size:18px;">${sw}%</div>
            <div style="font-size:11px;color:#8b949e;">B&H: ${bh}%</div></div></div>`;
      }
      h += '</div>';
      return h;
    }

    function marginBadge(margin, signal) {
      if (margin == null) return '';
      const abs = Math.abs(margin).toFixed(2);
      const isL = signal === 'LONG';
      const color = isL ? (margin > 0.5 ? '#3fb950' : margin > 0.2 ? '#d29922' : '#f85149')
                        : (margin < -0.5 ? '#f85149' : margin < -0.2 ? '#d29922' : '#3fb950');
      const label = isL ? `Marge: +${abs}` : `Marge: −${abs}`;
      return `<div style="font-size:10px;color:${color};margin-top:2px;">📊 ${label}</div>`;
    }

    // ══════════════════════════════════════════════════════════════════════
    // ── ETF DETAIL ──────────────────────────────────────────────────────
    // ══════════════════════════════════════════════════════════════════════
    function renderETF(d) {
      const sub = subTab[activeTab] || 'signal';
      let h = '<div class="sub-tabs">';
      for (const [k,l] of [['signal','Signal'],['historie','Historie'],['matrix','Matrix'],['details','Details']]) {
        h += `<div class="sub-tab ${sub===k?'active':''}" data-sub="${k}">${l}</div>`;
      }
      h += '</div>';
      if (sub==='signal') h += renderETFSignal(d);
      else if (sub==='historie') h += renderETFHistory(d);
      else if (sub==='matrix') h += renderETFMatrix(d);
      else if (sub==='details') h += renderETFDetails(d);
      return h;
    }

    function afterETFRender(d) {
      const sub = subTab[activeTab] || 'signal';
      if (sub==='signal') drawChart('eqChart', d.equity_1y, true);
      else if (sub==='historie') drawChart('fullChart', d.equity_full, true);
      enableAllChartZoom();
    }

    function renderETFSignal(d) {
      const isL = d.signal==='LONG', cls = isL?'long':'cash';
      let h = `<div class="signal-card ${cls}">
        <div class="signal-etf-name">${d.ticker.replace('.DE','')} — ${d.name}</div>
        <div class="signal-badge ${cls}">${isL?'🟢 LONG':'🔴 CASH'}</div>
        <div class="signal-strategy">Strategie: <strong>${d.strategy}</strong></div>
        ${marginBadge(d.signal_margin, d.signal)}
        <div class="signal-date">Stand: ${d.last_date}</div>
        ${d.strat_margins ? renderStrategieMargins(d.strat_margins) : ''}
      </div>`;

      const sw=pct(d.return_1y_switch), bh=pct(d.return_1y_bh), pi=Math.round((d.pct_invested_1y||0)*100);
      h += `<div class="section"><div class="section-title">Letztes Jahr</div>
        <div class="year-perf"><div class="year-perf-header">
          <div class="year-perf-item"><div class="label">Switch</div>
            <div class="value ${d.return_1y_switch>=0?'positive':'negative'}">${sw}%</div></div>
          <div class="year-perf-item"><div class="label">B&H</div>
            <div class="value ${d.return_1y_bh>=0?'positive':'negative'}">${bh}%</div></div>
        </div><div class="year-perf-bar"><span>Investiert: ${pi}%</span>
          <div class="invest-bar"><div class="fill" style="width:${pi}%"></div></div></div></div></div>`;

      h += `<div class="section"><div class="section-title">12M Equity</div>
        <div class="chart-container"><canvas id="eqChart"></canvas></div>`;
      if (d.equity_1y && d.equity_1y.length) {
        h += '<div class="cash-indicator">';
        for (const p of d.equity_1y) h += `<div class="day ${p.cash?'cash':'long'}"></div>`;
        h += '</div><div class="chart-legend"><span class="sw">Switch</span><span class="bh">B&H</span></div>';
      }
      h += '</div>';

      h += `<div class="section"><div class="section-title">Gesamtzeitraum</div><div class="metrics-grid">
        ${mc('CAGR',pct(d.cagr_switch)+'%','B&H: '+pct(d.cagr_bh)+'%','positive')}
        ${mc('Sharpe',d.sharpe_switch,'B&H: '+d.sharpe_bh,'neutral')}
        ${mc('Max DD',pct(d.max_dd_switch)+'%','B&H: '+pct(d.max_dd_bh)+'%','negative')}
        ${mc('Investiert',Math.round(d.pct_invested*100)+'%','','neutral')}
      </div></div>`;
      return h;
    }

    function renderStrategieMargins(margins) {
      if (!margins || !Object.keys(margins).length) return '';
      let h = '<div style="margin-top:10px;text-align:left;font-size:11px;">';
      h += '<div style="color:#8b949e;margin-bottom:4px;">Rolling Sharpe pro Strategie:</div>';
      for (const [name, val] of Object.entries(margins)) {
        const clr = val > 0.3 ? '#3fb950' : val > 0 ? '#d29922' : '#f85149';
        const bar = Math.min(100, Math.abs(val) * 50);
        h += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
          <span style="flex:0 0 75px;color:#8b949e;">${name}</span>
          <div style="flex:1;height:6px;background:#21262d;border-radius:3px;overflow:hidden;">
            <div style="width:${bar}%;height:100%;background:${clr};border-radius:3px;"></div>
          </div>
          <span style="flex:0 0 40px;text-align:right;color:${clr};font-weight:600;">${val.toFixed(2)}</span>
        </div>`;
      }
      h += '</div>';
      return h;
    }

    function renderETFHistory(d) {
      let h = `<div class="section"><div class="section-title">${d.ticker.replace('.DE','')} — Gesamte Historie</div>
        <div class="chart-container" style="height:260px;"><canvas id="fullChart"></canvas></div>`;
      if (d.equity_full && d.equity_full.length) {
        h += '<div class="cash-indicator">';
        for (const p of d.equity_full) h += `<div class="day ${p.cash?'cash':'long'}"></div>`;
        h += '</div>';
      }
      h += '<div class="chart-legend"><span class="sw">Switch</span><span class="bh">B&H</span></div></div>';
      if (d.yearly_returns && d.yearly_returns.length) h += renderYearlyBars(d.yearly_returns);
      if (d.trades && d.trades.length) h += renderTrades(d.trades);
      return h;
    }

    function renderETFMatrix(d) {
      const M = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
      return buildHeatmap(d.months_switch, d.ticker.replace('.DE','')+' — Switch', M) +
             buildHeatmap(d.months_bh, d.ticker.replace('.DE','')+' — Buy & Hold', M);
    }

    function renderETFDetails(d) {
      let h = `<div class="section"><div class="section-title">Kennzahlen</div>
        <table class="detail-table"><thead><tr><th>Kennzahl</th><th>Switch</th><th>B&H</th></tr></thead><tbody>`;
      const rows = [
        ['CAGR',pct(d.cagr_switch)+'%',pct(d.cagr_bh)+'%'],
        ['Sharpe',d.sharpe_switch,d.sharpe_bh],
        ['Sortino',d.sortino_switch??'—',d.sortino_bh??'—'],
        ['Calmar',d.calmar_switch??'—',d.calmar_bh??'—'],
        ['Max DD',pct(d.max_dd_switch)+'%',pct(d.max_dd_bh)+'%'],
        ['Max Underwater',(d.max_uw_switch??'—')+' Tg',(d.max_uw_bh??'—')+' Tg'],
        ['Volatilität',pct(d.vol_switch)+'%',pct(d.vol_bh)+'%'],
        ['Bestes Jahr',(d.best_year_switch??'—')+'%',(d.best_year_bh??'—')+'%'],
        ['Schlechtestes J.',(d.worst_year_switch??'—')+'%',(d.worst_year_bh??'—')+'%'],
        ['Win Rate',(d.win_rate_switch??'—')+'%',(d.win_rate_bh??'—')+'%'],
        ['Investiert',Math.round(d.pct_invested*100)+'%','100%'],
      ];
      for (const [l,s,b] of rows) h += `<tr><td>${l}</td><td>${s}</td><td>${b}</td></tr>`;
      h += '</tbody></table></div>';
      if (d.equity_full && d.equity_full.length > 1) {
        const last = d.equity_full[d.equity_full.length-1];
        const s10=Math.round(last.switch*10000).toLocaleString('de-DE'), b10=Math.round(last.bh*10000).toLocaleString('de-DE');

    function renderAlphaMixStocks(cat) {
      let h = `<div class="section"><div class="section-title">🧬 Alpha-Mix — Optimale Gewichtung</div>`;
      h += `<div class="card" style="margin-bottom:12px;padding:16px;">`;
      if (cat.weights) {
        h += '<div style="font-size:14px;margin-bottom:8px;"><b>Gewichtung (Sharpe-optimiert):</b></div>';
        const wLabels = {'swarm':'🐝 Schwarm','value':'💎 Value','turnaround':'🔄 Turnaround'};
        for (const [k,v] of Object.entries(cat.weights)) {
          h += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
            <span>${wLabels[k]||k}</span><span style="font-weight:700;">${v}</span></div>`;
        }
      }
      const sw = pct(cat.cagr_switch), bh = pct(cat.cagr_bh);
      h += `<div class="metrics-grid" style="margin-top:12px;">
        ${mc('CAGR Switch', sw+'%','','positive')}
        ${mc('CAGR B&H', bh+'%','','neutral')}
        ${mc('Sharpe', cat.sharpe_switch,'','positive')}
        ${mc('Max DD', pct(cat.max_dd_switch)+'%','','negative')}
      </div></div></div>`;

      // Consolidate stocks: merge duplicates across categories
      const catIcons = {'swarm':'🐝','value':'💎','turnaround':'🔄'};
      const merged = {};
      for (const st of (cat.stocks||[])) {
        const t = st.ticker;
        if (merged[t]) {
          merged[t].cats.push(st.category||'other');
          if (st.signal==='LONG') merged[t].signal='LONG';
        } else {
          merged[t] = {...st, cats:[st.category||'other']};
        }
      }
      const mList = Object.values(merged);
      const longList = mList.filter(s=>s.signal==='LONG');
      const cashList = mList.filter(s=>s.signal!=='LONG');

      // Allocation preview (40/40/20 per category, equal within category)
      const catWeights = cat.weights||{};
      const catParsed = {};
      for (const [k,v] of Object.entries(catWeights)) catParsed[k] = parseFloat(String(v).replace('%',''))/100;
      const longPerCat = {};
      for (const st of (cat.stocks||[])) {
        if (st.signal==='LONG') { const c=st.category||'other'; longPerCat[c]=(longPerCat[c]||0)+1; }
      }
      // Compute allocation % per consolidated stock
      for (const m of mList) {
        let allocPct = 0;
        if (m.signal==='LONG') {
          for (const c of m.cats) {
            const w = catParsed[c]||0;
            const n = longPerCat[c]||1;
            allocPct += w/n;
          }
        }
        m.allocPct = allocPct;
      }

      h += `<div class="section"><div class="section-title">📊 Portfolio (${longList.length} LONG / ${cashList.length} CASH)</div><div class="card-grid">`;
      for (const st of [...longList.sort((a,b)=>b.allocPct-a.allocPct), ...cashList]) {
        const isL = st.signal==='LONG';
        const catTags = st.cats.map(c=>catIcons[c]||c).join(' ');
        h += `<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:700;">${st.ticker}</span>
            <span class="badge ${isL?'long':'cash'}">${st.signal}</span>
          </div>
          <div style="color:var(--text-secondary);font-size:13px;">${st.name||''}</div>
          <div style="font-size:13px;margin-top:4px;">
            ${catTags}${st.cats.length>1?' <span style="color:var(--accent);font-weight:600;">(kombiniert)</span>':''}
            ${isL?' · <b>'+Math.round(st.allocPct*100)+'%</b> Allokation':''}
          </div>
          <div style="font-size:12px;color:var(--text-secondary);">Sharpe: ${st.sharpe} | Inv: ${Math.round(st.pct_invested*100)}%</div>
        </div>`;
      }
      h += '</div></div>';
      return h;
    }

    function renderAlphaMixDetails(cat) {

      h += '<table class="detail-table"><thead><tr><th>Kennzahl</th><th>Switch</th><th>B&H</th></tr></thead><tbody>';

    // ══════════════════════════════════════════════════════════════════════
    // ── ALPACA VALIDATION ───────────────────────────────────────────────
    // ══════════════════════════════════════════════════════════════════════
    function renderAlpacaValidation(cat) {
      if (!tradeLog.length) return '<div class="loading"><div>⚠️ Kein Alpaca Trade-Log</div></div>';

      const startEq = tradeLog[0].equity;
      const lastEntry = tradeLog[tradeLog.length - 1];
      const currentEq = lastEntry.equity;
      const alpacaReturn = ((currentEq / startEq) - 1) * 100;

      // Compute switching return over same period
      const startDate = tradeLog[0].date.split(' ')[0];
      const endDate = lastEntry.date.split(' ')[0];
      const valEquity = cat.validation_equity || cat.equity;
      let switchReturn = null;
      if (valEquity && valEquity.length > 1) {
        let startIdx = -1, endIdx = -1;
        for (let i = 0; i < valEquity.length; i++) {
          if (startIdx < 0 && valEquity[i].date >= startDate) startIdx = i;
          if (valEquity[i].date <= endDate) endIdx = i;
        }
        if (startIdx >= 0 && endIdx > startIdx) {
          switchReturn = ((valEquity[endIdx].switch / valEquity[startIdx].switch) - 1) * 100;
        }
      }

      const delta = switchReturn != null ? (alpacaReturn - switchReturn).toFixed(2) : '—';
      const deltaColor = switchReturn != null ? (alpacaReturn >= switchReturn ? 'var(--green)' : 'var(--red)') : '#8b949e';

      let h = '<div class="section"><div class="section-title">🏦 Alpaca Paper-Trading Validierung</div>';

      // Capital summary
      h += '<div class="card" style="padding:16px;margin-bottom:12px;">';
      h += '<div class="metrics-grid">';
      h += mc('Startkapital', '$' + startEq.toLocaleString('de-DE'), tradeLog[0].date.split(' ')[0], 'neutral');
      h += mc('Aktuell', '$' + currentEq.toLocaleString('de-DE', {minimumFractionDigits:2}), lastEntry.date.split(' ')[0], alpacaReturn >= 0 ? 'positive' : 'negative');
      h += mc('Alpaca Return', (alpacaReturn >= 0 ? '+' : '') + alpacaReturn.toFixed(2) + '%', 'reale Trades', alpacaReturn >= 0 ? 'positive' : 'negative');
      h += mc('Switch Return', switchReturn != null ? (switchReturn >= 0 ? '+' : '') + switchReturn.toFixed(2) + '%' : '—', 'Backtest', 'neutral');
      h += '</div>';
      h += `<div style="margin-top:12px;padding:10px;background:#161b22;border-radius:8px;border:1px solid var(--border);text-align:center;">
        <span style="color:#8b949e;font-size:12px;">Delta (Alpaca − Switch):</span>
        <span style="font-size:18px;font-weight:700;color:${deltaColor};margin-left:8px;">${delta}%</span>
      </div>`;
      h += '</div></div>';

      // Position breakdown
      if (lastEntry.positions && Object.keys(lastEntry.positions).length) {
        h += '<div class="section"><div class="section-title">📊 Aktuelle Positionen</div>';
        h += `<div style="font-size:12px;color:#8b949e;margin-bottom:8px;">
          ${lastEntry.n_positions} Positionen | ${(lastEntry.pct_invested > 1 ? lastEntry.pct_invested : lastEntry.pct_invested * 100).toFixed(0)}% investiert | Cash: $${Number(lastEntry.cash).toLocaleString('de-DE', {minimumFractionDigits:0})}</div>`;
        h += '<table class="detail-table"><thead><tr><th>Aktie</th><th>Stk</th><th>Kurs</th><th>Wert</th></tr></thead><tbody>';
        const sortedPos = Object.entries(lastEntry.positions).sort((a,b) => b[1].value - a[1].value);
        for (const [sym, pos] of sortedPos) {
          h += `<tr><td style="font-weight:700;">${sym}</td><td>${pos.qty}</td>`;
          h += `<td>$${pos.price.toFixed(2)}</td><td>$${pos.value.toLocaleString('de-DE', {minimumFractionDigits:0})}</td></tr>`;
        }
        h += '</tbody></table></div>';
      }

      // Equity chart: Switching vs Alpaca
      h += `<div class="section"><div class="section-title">Equity: Switching vs Alpaca</div>
        <div class="chart-container" style="height:240px;"><canvas id="validationChart"></canvas></div>
        <div class="chart-legend"><span class="sw">Switch (Backtest)</span><span style="color:#d29922;">● Alpaca (Real)</span></div></div>`;

      // Alpaca monthly returns
      const alpacaMonths = computeAlpacaMonthlyReturns();
      if (Object.keys(alpacaMonths).length) {
        const M = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
        h += buildHeatmap(alpacaMonths, 'Monatsrenditen (Alpaca Real)', M);
        if (cat.months_switch) h += buildHeatmap(cat.months_switch, 'Monatsrenditen (Switch Backtest)', M);
      }

      // Trade history (expandable)
      h += '<div class="section"><div class="section-title">📋 Alpaca Trade-History</div>';
      h += '<div class="trade-log">';
      for (const entry of [...tradeLog].reverse()) {
        const d = entry.date;
        const eq = entry.equity;
        const ret = ((eq / startEq - 1) * 100).toFixed(2);
        const orders = entry.orders || [];
        const errors = orders.filter(o => String(o.status || '').includes('ERROR')).length;
        let orderSummary = '';
        if (orders.length) {

    function computeAlpacaMonthlyReturns() {
      if (tradeLog.length < 2) return {};
      const months = {};
      // Group entries by month, compute return within each month
      const byMonth = {};
      for (const entry of tradeLog) {
        const d = entry.date.split(' ')[0];
        const [yr, mo] = d.split('-').map(Number);
        const key = yr + '-' + mo;
        if (!byMonth[key]) byMonth[key] = [];
        byMonth[key].push(entry);
      }
      // For each month: return = (last equity / first equity - 1) * 100
      // First month uses startEq as reference
      let prevEq = tradeLog[0].equity;
      const sortedKeys = Object.keys(byMonth).sort();
      for (const key of sortedKeys) {
        const entries = byMonth[key];
        const [yr, mo] = key.split('-').map(Number);
        const lastEq = entries[entries.length - 1].equity;
        const ret = ((lastEq / prevEq) - 1) * 100;
        if (!months[yr]) months[yr] = {};
        months[yr][String(mo)] = Math.round(ret * 10) / 10;
        prevEq = lastEq;
      }
      return months;
    }

    function drawValidationChart(id, cat, log) {
      const canvas = document.getElementById(id);
      if (!canvas || !log || !log.length) return;
      const valEquity = cat.validation_equity || cat.equity;
      if (!valEquity || !valEquity.length) return;

      const startEq = log[0].equity;
      const alpacaPoints = log.map(e => ({
        date: e.date.split(' ')[0],
        value: e.equity / startEq
      }));

      const firstDate = alpacaPoints[0].date;
      const lastDate = alpacaPoints[alpacaPoints.length - 1].date;
      let startIdx = -1;
      for (let i = 0; i < valEquity.length; i++) {
        if (valEquity[i].date >= firstDate) { startIdx = i; break; }
      }
      if (startIdx < 0) startIdx = valEquity.length - 1;
      const baseSwitch = valEquity[startIdx].switch;
      const switchPoints = valEquity.filter(d => d.date >= firstDate && d.date <= lastDate)
        .map(d => ({ date: d.date, value: d.switch / baseSwitch }));

      const allDates = new Set();
      alpacaPoints.forEach(p => allDates.add(p.date));
      switchPoints.forEach(p => allDates.add(p.date));
      const sortedDates = [...allDates].sort();

      const alpacaMap = {}; alpacaPoints.forEach(p => alpacaMap[p.date] = p.value);
      const switchMap = {}; switchPoints.forEach(p => switchMap[p.date] = p.value);

      let lastAlpaca = 1, lastSwitch = 1;
      const combined = sortedDates.map(d => {
        if (alpacaMap[d] != null) lastAlpaca = alpacaMap[d];
        if (switchMap[d] != null) lastSwitch = switchMap[d];
        return { date: d, alpaca: lastAlpaca, switch: lastSwitch };
      });

      const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = (rect.height - 16) * dpr;
      canvas.style.width = rect.width + 'px'; canvas.style.height = (rect.height - 16) + 'px';
      ctx.scale(dpr, dpr);
      const W = rect.width, H = rect.height - 16;
      const pad = {top: 10, right: 10, bottom: 20, left: 48};
      const cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;
      const allV = combined.flatMap(d => [d.alpaca, d.switch]);
      const mn = Math.min(...allV) * 0.998, mx = Math.max(...allV) * 1.002;
      const n = combined.length;
      const x = i => pad.left + (i / Math.max(1, n - 1)) * cW;
      const y = v => mx === mn ? pad.top + cH / 2 : pad.top + (1 - (v - mn) / (mx - mn)) * cH;

      ctx.fillStyle = '#161b22'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#21262d'; ctx.lineWidth = 0.5;
      for (let i = 0; i <= 4; i++) {
        const yy = pad.top + (i / 4) * cH;
        ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(W - pad.right, yy); ctx.stroke();
        const v = mx - (i / 4) * (mx - mn);
        ctx.fillStyle = '#8b949e'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(((v - 1) * 100).toFixed(1) + '%', pad.left - 4, yy + 3);
      }
      ctx.textAlign = 'center';
      const ds = Math.max(1, Math.floor(n / 5));
      for (let i = 0; i < n; i += ds) {
        const p = combined[i].date.split('-');
        ctx.fillStyle = '#8b949e'; ctx.fillText(p[2] + '/' + p[1], x(i), H - 4);
      }
      // Switching line (green)
      ctx.beginPath(); ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2;
      for (let i = 0; i < n; i++) { i === 0 ? ctx.moveTo(x(i), y(combined[i].switch)) : ctx.lineTo(x(i), y(combined[i].switch)); }
      ctx.stroke();
      // Alpaca line (gold)
      ctx.beginPath(); ctx.strokeStyle = '#d29922'; ctx.lineWidth = 2;
      for (let i = 0; i < n; i++) { i === 0 ? ctx.moveTo(x(i), y(combined[i].alpaca)) : ctx.lineTo(x(i), y(combined[i].alpaca)); }
      ctx.stroke();
      // Alpaca dots
      ctx.fillStyle = '#d29922';
      for (let i = 0; i < n; i++) {
        if (alpacaMap[combined[i].date] != null) {
          ctx.beginPath(); ctx.arc(x(i), y(combined[i].alpaca), 3, 0, Math.PI * 2); ctx.fill();
        }
      }
      // End labels
      const lastC = combined[n - 1];
      const swRet = ((lastC.switch - 1) * 100).toFixed(1);
      const alRet = ((lastC.alpaca - 1) * 100).toFixed(1);
      ctx.font = '11px -apple-system,sans-serif'; ctx.textAlign = 'right';
      ctx.fillStyle = '#3fb950'; ctx.fillText('SW: ' + (swRet >= 0 ? '+' : '') + swRet + '%', W - pad.right, pad.top + 14);
      ctx.fillStyle = '#d29922'; ctx.fillText('ALP: ' + (alRet >= 0 ? '+' : '') + alRet + '%', W - pad.right, pad.top + 28);

      canvas._chartData = combined.map(d => ({ date: d.date, switch: d.switch, alpaca: d.alpaca }));
    }

    function renderYearlyBars(yearly) {
      let h = '<div class="section"><div class="section-title">Jährliche Returns</div><div class="yearly-bars">';
      for (const yr of yearly) {
        const mx = Math.max(Math.abs(yr.switch), Math.abs(yr.bh), 1);
        const sw = Math.min(100, Math.abs(yr.switch)/mx*100), bh = Math.min(100, Math.abs(yr.bh)/mx*100);
        h += `<div class="yr-row"><div class="yr-label">${yr.year}</div><div class="yr-bars">
          <div class="yr-bar sw ${yr.switch>=0?'pos':'neg'}" style="width:${sw}%"><span>${yr.switch>0?'+':''}${yr.switch.toFixed(1)}%</span></div>
          <div class="yr-bar bh ${yr.bh>=0?'pos':'neg'}" style="width:${bh}%"><span>${yr.bh>0?'+':''}${yr.bh.toFixed(1)}%</span></div>
        </div></div>`;
      }
      h += '</div><div class="chart-legend" style="margin-top:6px;"><span class="sw">Switch</span><span class="bh">B&H</span></div></div>';
      return h;
    }

    function renderTrades(trades) {
      let h = '<div class="section"><div class="section-title">Letzte Trades</div><div class="trade-log">';
      for (const t of [...trades].reverse()) {
        const buy = t.Aktion.includes('KAUF');
        let rendite = '';
        if (t.Rendite != null) rendite = `<div class="trade-pnl ${t.Rendite>=0?'pos':'neg'}">${t.Rendite>0?'+':''}${t.Rendite}%</div>`;
        h += `<div class="trade-row ${buy?'buy':'sell'}">
          <div class="trade-date">${t.Datum}</div>
          <div class="trade-action">${buy?'🟢':'🔴'} ${t.Aktion}</div>
          <div style="text-align:right;"><div class="trade-price">${t.Kurs}</div>${rendite}</div></div>`;
      }
      h += '</div></div>';
      return h;
    }

    function buildHeatmap(data, title, M) {
      if (!data) return '';
      const years = Object.keys(data).map(Number).sort();
      let h = `<div class="section"><div class="section-title">${title}</div>
        <div class="heatmap-scroll"><table class="heatmap"><thead><tr><th></th>`;
      for (const m of M) h += `<th>${m}</th>`;
      h += '<th style="font-weight:700;">Jahr</th></tr></thead><tbody>';
      for (const yr of years) {
        h += `<tr><td class="yr">${yr}</td>`;
        let yrTotal = 0, hasAny = false;
        for (let m=1;m<=12;m++) {
          const v = data[String(yr)]?.[String(m)];
          if (v!=null) {
            hasAny = true;
            yrTotal += v;
            const c=heatClr(v), tc = Math.abs(v)>4?'#fff':'#ccc';
            h += `<td style="background:${c};color:${tc}">${v.toFixed(1)}</td>`;
          } else h += '<td class="empty"></td>';
        }
        if (hasAny) {
          const c=heatClr(yrTotal/3), tc = Math.abs(yrTotal)>8?'#fff':'#ccc';
          h += `<td style="background:${c};color:${tc};font-weight:700;">${yrTotal.toFixed(1)}%</td>`;
        } else h += '<td class="empty"></td>';
        h += '</tr>';
      }
      h += '</tbody></table></div></div>';
      return h;
    }

    function heatClr(v) {
      const t = (Math.max(-10,Math.min(10,v))+10)/20;
      if (t<0.5) { const f=t*2; return `rgba(${200-Math.round(f*80)},${50+Math.round(f*140)},${40+Math.round(f*20)},0.85)`; }
      else { const f=(t-0.5)*2; return `rgba(${120-Math.round(f*80)},${190-Math.round(f*20)},${60-Math.round(f*10)},0.85)`; }
    }

    function quotaByFund() {
      const by = {};
      for (const r of QUOTA) if (r.fund && r.as_of) (by[r.fund] = by[r.fund] || []).push(r);
      return Object.keys(by).sort().map(f => {
        const rs = by[f].sort((a, b) => a.as_of.localeCompare(b.as_of)), z = rs[rs.length - 1], yr = z.as_of.slice(0, 4);
        const ys = rs.filter(r => r.as_of.startsWith(yr)), q = ys.map(r => Number(r.equity_quota));
        return {fund: f, as_of: z.as_of, quota: Number(z.equity_quota), n_stocks: z.n_stocks, net: Number(z.net_assets_usd),
                year: yr, first: ys[0].as_of, days: ys.length, min: Math.min(...q)};
      });
    }

    function drawChart(id, eq, showCash) {
      const canvas = document.getElementById(id);
      if (!canvas || !eq || !eq.length) return;
      const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
      const rect=canvas.parentElement.getBoundingClientRect();
      canvas.width=rect.width*dpr; canvas.height=(rect.height-16)*dpr;
      canvas.style.width=rect.width+'px'; canvas.style.height=(rect.height-16)+'px';
      ctx.scale(dpr,dpr);
      const W=rect.width, H=rect.height-16, pad={top:10,right:10,bottom:20,left:48};
      const cW=W-pad.left-pad.right, cH=H-pad.top-pad.bottom;
      const sw=eq.map(d=>d.switch), bh=eq.map(d=>d.bh), all=[...sw,...bh];
      const mn=Math.min(...all)*.98, mx=Math.max(...all)*1.02, n=eq.length;
      const x=i=>pad.left+(i/Math.max(1,n-1))*cW;
      const y=v=>mx===mn?pad.top+cH/2:pad.top+(1-(v-mn)/(mx-mn))*cH;
      ctx.fillStyle='#161b22'; ctx.fillRect(0,0,W,H);
      if (showCash) for(let i=0;i<n;i++) if(eq[i].cash) { ctx.fillStyle=`rgba(248,81,73,${0.08*Number(eq[i].cash)})`; ctx.fillRect(x(i)-cW/n/2,pad.top,cW/n+.5,cH); }
      ctx.strokeStyle='#21262d'; ctx.lineWidth=.5;
      for(let i=0;i<=4;i++){const yy=pad.top+(i/4)*cH; ctx.beginPath();ctx.moveTo(pad.left,yy);ctx.lineTo(W-pad.right,yy);ctx.stroke();
        const v=mx-(i/4)*(mx-mn); ctx.fillStyle='#8b949e';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';ctx.fillText(v>=10?v.toFixed(1):v.toFixed(2),pad.left-4,yy+3);}
      ctx.textAlign='center'; const ds=Math.max(1,Math.floor(n/5));
      for(let i=0;i<n;i+=ds){const p=eq[i].date.split('-');ctx.fillStyle='#8b949e';ctx.fillText(p[1]+'/'+p[0].slice(2),x(i),H-4);}
      ctx.beginPath();ctx.strokeStyle='#58a6ff';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
      for(let i=0;i<n;i++){i===0?ctx.moveTo(x(i),y(bh[i])):ctx.lineTo(x(i),y(bh[i]));}ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.strokeStyle='#3fb950';ctx.lineWidth=2;
      for(let i=0;i<n;i++){i===0?ctx.moveTo(x(i),y(sw[i])):ctx.lineTo(x(i),y(sw[i]));}ctx.stroke();
      // Store data for tooltip
      canvas._chartData = eq.map(d=>({date:d.date, switch:d.switch, bh:d.bh, cash:d.cash}));
    }

    function drawStockChart(id, stocksData) {
      if (!stocksData) return;
      const canvas=document.getElementById(id); if(!canvas) return;
      const tickers=Object.keys(stocksData); if(!tickers.length) return;
      const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
      const rect=canvas.parentElement.getBoundingClientRect();
      canvas.width=rect.width*dpr; canvas.height=(rect.height-16)*dpr;
      canvas.style.width=rect.width+'px'; canvas.style.height=(rect.height-16)+'px';
      ctx.scale(dpr,dpr);
      const W=rect.width,H=rect.height-16,pad={top:10,right:10,bottom:20,left:44};
      const cW=W-pad.left-pad.right, cH=H-pad.top-pad.bottom;
      let allV=[]; for(const t of tickers) for(const p of stocksData[t]) allV.push(p.value);
      const mn=Math.min(...allV)*.98, mx=Math.max(...allV)*1.02;
      const y=v=>mx===mn?pad.top+cH/2:pad.top+(1-(v-mn)/(mx-mn))*cH;
      ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#21262d';ctx.lineWidth=.5;
      for(let i=0;i<=4;i++){const yy=pad.top+(i/4)*cH;ctx.beginPath();ctx.moveTo(pad.left,yy);ctx.lineTo(W-pad.right,yy);ctx.stroke();
        const v=mx-(i/4)*(mx-mn);ctx.fillStyle='#8b949e';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';ctx.fillText(v.toFixed(2),pad.left-4,yy+3);}
      if(mn<1&&mx>1){ctx.beginPath();ctx.strokeStyle='#484f58';ctx.lineWidth=.5;ctx.setLineDash([3,3]);ctx.moveTo(pad.left,y(1));ctx.lineTo(W-pad.right,y(1));ctx.stroke();ctx.setLineDash([]);}
      const colors=['#3fb950','#58a6ff','#f85149','#d29922','#bc8cff','#f778ba','#79c0ff','#56d4dd','#e3b341','#adbac7'];
      let legend='';
      tickers.forEach((t,ti)=>{const pts=stocksData[t];if(!pts.length)return;
        ctx.beginPath();ctx.strokeStyle=colors[ti%colors.length];ctx.lineWidth=1.5;
        for(let i=0;i<pts.length;i++){const xi=pad.left+(i/Math.max(1,pts.length-1))*cW;i===0?ctx.moveTo(xi,y(pts[i].value)):ctx.lineTo(xi,y(pts[i].value));}
        ctx.stroke(); const lv=((pts[pts.length-1].value-1)*100).toFixed(1);
        legend+=`<span style="color:${colors[ti%colors.length]}">● ${t} ${lv>0?'+':''}${lv}%</span>`;});
      const el=document.getElementById('stockLegend'); if(el) el.innerHTML=legend;
      // Store data for tooltip: use first ticker's dates
      const ft = tickers[0]; const fpts = stocksData[ft];
      if (fpts && fpts.length) canvas._chartData = fpts.map(d=>({date:d.date, value:d.value}));
    }

    // ── Helpers ─────────────────────────────────────────────────────────
    function pct(v){return v!=null?(v*100).toFixed(1):'—';}
    function mc(l,v,s,c){return `<div class="metric-card"><div class="metric-label">${l}</div><div class="metric-value ${c}">${v}</div>${s?'<div class="metric-sub">'+s+'</div>':''}</div>`;}

    // ── Stock Detail Modal ──────────────────────────────────────────────
    // ── Interactive Chart Touch: Crosshair + Date/Value Tooltip ────────
    function enableChartZoom(container) {
      if (!container) return;
      const canvas = container.querySelector('canvas');
      if (!canvas) return;
      // Store chart data on the canvas for tooltip
      if (!canvas._chartData) return;
      const data = canvas._chartData;

      container.style.touchAction = 'none';
      container.style.position = 'relative';

      // Tooltip element
      let tooltip = container.querySelector('.chart-tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.className = 'chart-tooltip';
        tooltip.style.cssText = 'position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(22,27,34,0.95);color:#e6edf3;padding:4px 10px;border-radius:6px;font-size:12px;pointer-events:none;display:none;white-space:nowrap;border:1px solid #30363d;z-index:10;';
        container.appendChild(tooltip);
      }
      // Vertical crosshair line
      let crosshair = container.querySelector('.chart-crosshair');
      if (!crosshair) {
        crosshair = document.createElement('div');
        crosshair.className = 'chart-crosshair';
        crosshair.style.cssText = 'position:absolute;top:10px;width:1px;background:#58a6ff;opacity:0.5;pointer-events:none;display:none;z-index:9;';
        container.appendChild(crosshair);
      }

      function handleTouch(clientX) {
        const rect = canvas.getBoundingClientRect();
        const xRel = clientX - rect.left;
        const pad = {left:48, right:10};
        const cW = rect.width - pad.left - pad.right;
        const idx = Math.round(((xRel - pad.left) / cW) * (data.length - 1));
        if (idx < 0 || idx >= data.length) { tooltip.style.display = 'none'; crosshair.style.display = 'none'; return; }
        const d = data[idx];
        const dateStr = d.date.split('-').reverse().join('.');
        let valStr = '';
        if (d.switch != null && d.bh != null) valStr = `Sw: ${(d.switch*100-100).toFixed(1)}% | BH: ${(d.bh*100-100).toFixed(1)}%`;
        else if (d.switch != null && d.value != null) valStr = `Sw: ${(d.switch*100-100).toFixed(1)}% | BH: ${((d.value-1)*100).toFixed(1)}%`;
        else if (d.value != null) valStr = `${((d.value-1)*100).toFixed(1)}%`;
        const cf = Number(d.cash || 0);
        const cashStr = cf >= 0.99 ? ' 🔴 CASH' : cf > 0 ? ` 🟡 ${Math.round(cf * 100)}% Cash` : '';
        tooltip.textContent = `${dateStr}  ${valStr}${cashStr}`;
        tooltip.style.display = 'block';
        crosshair.style.left = xRel + 'px';
        crosshair.style.height = (rect.height - 30) + 'px';
        crosshair.style.display = 'block';
      }

      canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) { handleTouch(e.touches[0].clientX); }
      }, {passive: true});
      canvas.addEventListener('touchmove', e => {
        if (e.touches.length === 1) { e.preventDefault(); handleTouch(e.touches[0].clientX); }
      }, {passive: false});
      canvas.addEventListener('touchend', () => {
        setTimeout(() => { tooltip.style.display = 'none'; crosshair.style.display = 'none'; }, 1500);
      });
      // Mouse support for desktop
      canvas.addEventListener('mousemove', e => { handleTouch(e.clientX); });
      canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; crosshair.style.display = 'none'; });
    }

          </div>`;

      if (chartData && chartData.length > 1) {
        h += `<div class="section" style="margin:12px 0;">
          <div class="section-title">Kursverlauf (12 Monate)</div>
          <div class="chart-container" style="height:200px;"><canvas id="stockDetailChart"></canvas></div>
        </div>`;
      }

      if (trades.length) {
        h += '<div class="section" style="margin:12px 0;"><div class="section-title">Trades</div><div class="trade-log">';
        for (const t of [...trades].reverse()) {
          const buy = t.Aktion.includes('KAUF');
          let rendite = '';
          if (t.Rendite != null) rendite = `<div class="trade-pnl ${t.Rendite>=0?'pos':'neg'}">${t.Rendite>0?'+':''}${t.Rendite}%</div>`;
          h += `<div class="trade-row ${buy?'buy':'sell'}">
            <div class="trade-date">${t.Datum}</div>
            <div class="trade-action">${buy?'🟢':'🔴'} ${t.Aktion}</div>
            <div style="text-align:right;"><div class="trade-price">${t.Kurs}</div>${rendite}</div></div>`;
        }
        h += '</div></div>';
      }

      if (st.pe || st.div_yield || st.pct_from_high != null) {
        h += '<div class="metrics-grid" style="margin:12px 0;">';
        if (st.pe) h += mc('P/E', st.pe.toFixed(1),'','neutral');
        if (st.pb) h += mc('P/B', st.pb.toFixed(1),'','neutral');
        if (st.div_yield) h += mc('Dividende', st.div_yield+'%','','neutral');
        if (st.pct_from_high != null) h += mc('vom 52W Hoch', st.pct_from_high+'%','','negative');
        h += '</div>';
      }

      h += `<div style="text-align:center;margin-top:16px;">
            <button onclick="document.getElementById('stockModal').remove()" style="background:var(--accent);color:#fff;border:none;padding:10px 32px;border-radius:8px;font-size:15px;cursor:pointer;">Schließen</button>
          </div>
        </div></div>`;

      document.body.insertAdjacentHTML('beforeend', h);

      // Draw the single-stock chart with cash bars
      if (chartData && chartData.length > 1) {
        setTimeout(()=>{
          const canvas = document.getElementById('stockDetailChart');
          if (!canvas) return;
          const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
          const rect=canvas.parentElement.getBoundingClientRect();
          canvas.width=rect.width*dpr; canvas.height=(rect.height-16)*dpr;
          canvas.style.width=rect.width+'px'; canvas.style.height=(rect.height-16)+'px';
          ctx.scale(dpr,dpr);
          const W=rect.width,H=rect.height-16,pad={top:10,right:10,bottom:20,left:48};
          const cW=W-pad.left-pad.right,cH=H-pad.top-pad.bottom;
          const vals = chartData.map(d=>d.value);
          const swValsAll = chartData.filter(d=>d.switch!=null).map(d=>d.switch);
          const allVals = [...vals, ...swValsAll];
          const mn=Math.min(...allVals)*.98, mx=Math.max(...allVals)*1.02, n=chartData.length;
          const x=i=>pad.left+(i/Math.max(1,n-1))*cW;
          const y=v=>mx===mn?pad.top+cH/2:pad.top+(1-(v-mn)/(mx-mn))*cH;
          ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,H);
          // Cash bars (red background for CASH periods)
          for(let i=0;i<n;i++) {
            if(chartData[i].cash) {
              ctx.fillStyle='rgba(248,81,73,0.10)';
              ctx.fillRect(x(i)-cW/n/2, pad.top, cW/n+.5, cH);
            }
          }
          // Grid
          ctx.strokeStyle='#21262d';ctx.lineWidth=.5;
          for(let i=0;i<=4;i++){const yy=pad.top+(i/4)*cH;ctx.beginPath();ctx.moveTo(pad.left,yy);ctx.lineTo(W-pad.right,yy);ctx.stroke();
            const v=mx-(i/4)*(mx-mn);ctx.fillStyle='#8b949e';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';ctx.fillText(v.toFixed(2),pad.left-4,yy+3);}
          // Baseline at 1.0
          if(mn<1&&mx>1){ctx.beginPath();ctx.strokeStyle='#484f58';ctx.lineWidth=.5;ctx.setLineDash([3,3]);ctx.moveTo(pad.left,y(1));ctx.lineTo(W-pad.right,y(1));ctx.stroke();ctx.setLineDash([]);}
          // Date labels
          ctx.textAlign='center';const ds=Math.max(1,Math.floor(n/5));
          for(let i=0;i<n;i+=ds){const p=chartData[i].date.split('-');ctx.fillStyle='#8b949e';ctx.fillText(p[2]+'.'+p[1]+'.'+p[0].slice(2),x(i),H-4);}
          // Price line (blue when LONG, red when CASH)
          for(let i=1;i<n;i++){
            ctx.beginPath();ctx.lineWidth=2;
            ctx.strokeStyle=chartData[i].cash?'#f85149':'#58a6ff';
            ctx.moveTo(x(i-1),y(vals[i-1]));ctx.lineTo(x(i),y(vals[i]));ctx.stroke();
          }
          // Switching equity line (green)
          const hasSw = chartData[0] && chartData[0].switch != null;
          if (hasSw) {
            const swVals = chartData.map(d=>d.switch);
            ctx.beginPath();ctx.strokeStyle='#3fb950';ctx.lineWidth=2;ctx.setLineDash([]);
            for(let i=0;i<n;i++){i===0?ctx.moveTo(x(i),y(swVals[i])):ctx.lineTo(x(i),y(swVals[i]));}
            ctx.stroke();
          }
          // Cash/Long legend + Switch
          ctx.font='10px -apple-system,sans-serif';ctx.textAlign='left';
          ctx.fillStyle='#58a6ff'; ctx.fillText('● B&H',pad.left,H-4);
          ctx.fillStyle='#f85149'; ctx.fillText('● CASH',pad.left+45,H-4);
          if (hasSw) { ctx.fillStyle='#3fb950'; ctx.fillText('● Switch',pad.left+95,H-4); }
          // Return labels (top-right)
          const retBH = ((vals[vals.length-1]-1)*100).toFixed(1);
          if (hasSw) {
            const swVals = chartData.map(d=>d.switch);
            const retSW = ((swVals[swVals.length-1]-1)*100).toFixed(1);
            ctx.font='bold 11px -apple-system,sans-serif';ctx.textAlign='right';
            ctx.fillStyle='#3fb950';ctx.fillText('SW:'+(retSW>=0?'+':'')+retSW+'%',W-pad.right,pad.top+12);
            ctx.fillStyle='#58a6ff';ctx.fillText('B&H:'+(retBH>=0?'+':'')+retBH+'%',W-pad.right,pad.top+24);
          } else {
            ctx.fillStyle=retBH>=0?'#3fb950':'#f85149';ctx.font='bold 12px -apple-system,sans-serif';
            ctx.textAlign='right';ctx.fillText((retBH>=0?'+':'')+retBH+'%',W-pad.right,pad.top+14);
          }
          // Store data for tooltip
          canvas._chartData = chartData.map(d=>({date:d.date, value:d.value, cash:d.cash, switch:d.switch}));
          // Enable crosshair on this chart too
          enableChartZoom(canvas.parentElement);
        }, 50);
      }
    }

    // ── Init ────────────────────────────────────────────────────────────
    // fetchSignals() is called by showApp() after auth
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  </script>
</body>
</html>
