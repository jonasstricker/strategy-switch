name: Daily Strategy Calculation

on:
  schedule:
    # Mo-Fr 21:00 UTC (nach US-Börsenschluss) — Info-Berechnung Aktien-Switching (nur Dashboard, kein Trading)
    - cron: '0 21 * * 1-5'
    # Mo-Fr 14:45 UTC (nach US-Eröffnung) — Core-Signal aus Schlusskurs des Vortags + Trading
    - cron: '45 14 * * 1-5'
  workflow_dispatch:  # Manueller Trigger über GitHub UI
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'core'
        type: choice
        options:
          - core
          - compute
          - both

permissions:
  contents: write

jobs:
  compute:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'both' || github.event.inputs.job == 'compute')
      || github.event_name == 'schedule' && github.event.schedule == '0 21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily calculation
        env:
          SKIP_EMAIL: "1"
        run: python -m wf_backtest.daily_runner

      - name: Copy signals to GitHub Pages
        run: |
          mkdir -p docs/data
          cp wf_backtest/mobile_signals.json docs/data/mobile_signals.json

      # Zweiter Versuch des Holdings-Archivs (falls der Lauf am Morgen fehlschlug)
      - name: Archive ETF holdings (tax evidence)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m trading.holdings_archive

      - name: Commit & push results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/mobile_signals.json
          [ -d tax_evidence ] && git add tax_evidence
          [ -f docs/data/equity_quota.csv ] && git add docs/data/equity_quota.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "📊 Signals $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

  core:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'both' || github.event.inputs.job == 'core')
      || github.event_name == 'schedule' && github.event.schedule == '45 14 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: core-trading
      cancel-in-progress: false
    env:
      HAS_PAPER: ${{ secrets.ALPACA_KEY_ID != '' }}
      HAS_LIVE: ${{ secrets.ALPACA_LIVE_KEY_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bricht mit Fehler ab (→ kein Trading, GitHub-Mail), wenn Daten veraltet/ungültig sind
      - name: Core signal
        id: signal
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}          # nur für Daten-Fallback
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m wf_backtest.core_strategy

      - name: Trade (Alpaca Paper)
        if: steps.signal.outcome == 'success' && env.HAS_PAPER == 'true'
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE: ""
          TRADING_ENABLED: "1"
        run: python -m trading.alpaca_trader --execute

      - name: Trade (Alpaca Live 🔴)
        if: steps.signal.outcome == 'success' && env.HAS_LIVE == 'true'
        env:
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          ALPACA_LIVE: "1"
          TRADING_ENABLED: "1"
        run: python -m trading.alpaca_trader --execute --live

      # Steuer-Nachweis Teilfreistellung (§ 20 Abs. 4 InvStG): Original-Holdings von SSO/QLD
      # täglich archivieren -> tax_evidence/ (blockiert nie das Trading)
      - name: Archive ETF holdings (tax evidence)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m trading.holdings_archive

      - name: Publish & commit signal and trade logs
        if: always()
        run: |
          mkdir -p docs/data
          [ -f trading/trade_log.json ] && cp trading/trade_log.json docs/data/trade_log.json
          [ -f trading/trade_log_live.json ] && cp trading/trade_log_live.json docs/data/trade_log_live.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/data/core_signal.json docs/data/trade_log.json docs/data/trade_log_live.json \
                   docs/data/equity_quota.csv \
                   trading/trade_log.json trading/trade_log_live.json trading/failed_orders.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d tax_evidence ] && git add tax_evidence
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🎯 Core signal & trades $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi
